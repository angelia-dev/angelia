  /v1/deliveries:
    get:
      operationId: listDeliveries
      summary: List deliveries
      description: |
        Deliveries, newest event first. `status=dead` is the dead-letter view. A delivery outlives
        its subscription: `subscription_name` and `sink` are `null` once the subscription was
        deleted.

        `since` (inclusive) and `until` (exclusive) bound the time the event was recorded in the
        log, the order of this list, not the time of an attempt. `until` must be after `since`
        (`400`). `sink` keeps the deliveries of the subscriptions that deliver to that sink now;
        with `subscription` too, both must hold.
      tags: [deliveries]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Only deliveries in these states.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DeliveryStatus'
          example: [dead]
        - name: subscription
          in: query
          description: Only deliveries of this subscription, by name (current subscriptions) or by id (also deleted ones).
          schema:
            $ref: '#/components/schemas/NameOrId'
          example: platform-ci
        - name: event
          in: query
          description: Only deliveries of this event, by event id.
          schema:
            $ref: '#/components/schemas/Ulid'
          example: 01JBX2A7C8D9E0F1G2H3J4K5M6
        - name: sink
          in: query
          description: Only deliveries of the subscriptions that deliver to this sink now, by name. An unknown sink matches nothing.
          schema:
            $ref: '#/components/schemas/Name'
          example: ci-webhook
        - name: since
          in: query
          description: Only deliveries of events recorded at or after this time.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-11-01T00:00:00.000Z'
        - name: until
          in: query
          description: Only deliveries of events recorded before this time. Must be after `since`.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-11-02T00:00:00.000Z'
      responses:
        '200':
          description: One page of deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPage'
              examples:
                deadLetters:
                  $ref: '#/components/examples/DeliveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

