openapi: 3.1.0
info:
  title: Angelia API
  version: 0.10.2
  summary: REST API of Angelia, the self-hosted release event bus.
  description: |
    REST API of an Angelia instance: manage watches, sinks and subscriptions, read the
    known versions of a watch, pull or stream release events (optionally through a named
    consumer that keeps the cursor on the server), and inspect and replay deliveries.

    **Draft (spec 0.x).** This document may still change, including in a breaking way, in any
    0.x minor release of the spec repository. The `/v1` path prefix names the major version that
    is frozen at spec 1.0.0. Conventions (naming, pagination, errors, auth, versioning):
    [docs/api.md](https://github.com/angelia-dev/spec/blob/main/docs/api.md).

    - Every resource that the watch file manages (watches, sinks, subscriptions) is addressed by
      its `name` and written with an idempotent `PUT`, so `angelia apply` can upsert through the API.
    - Release events are the CloudEvents envelopes of
      [schemas/release/envelope/v1.json](https://github.com/angelia-dev/spec/blob/main/schemas/release/envelope/v1.json),
      returned unchanged.
    - Errors are RFC 9457 problem details (`application/problem+json`).
    - Every operation needs a bearer token with the scope it names (`read` < `write` < `admin`).
    - Secret values are stored write-only through `/v1/secrets` and referenced from configuration
      by name with a `*_ref` key; no response ever carries a value.
    - API tokens are managed through `/v1/tokens` (`admin`). A token's secret appears once, in the
      `201` response of `POST /v1/tokens`, and never again.
    - The instance's admin web UI signs people in (GitHub) and authenticates their requests with a
      session cookie instead of a token, with the scope of their role. `GET /v1/me` says who is
      calling; browser sessions are listed and revoked through `/v1/sessions` (`admin`).
    - Watches, sinks and subscriptions carry an `ETag`; `If-Match` and `If-None-Match: *` on `PUT`
      and `DELETE` make a write conditional (`412 precondition-failed`). Without them the last
      write wins.
    - `POST /v1/adoptions` (`admin`) hands watch-file resources over to the API in place, so the
      admin UI can edit them; the next startup skips their entries in the watch file.
  contact:
    name: Angelia maintainers
    url: https://github.com/angelia-dev/spec/issues
  license:
    name: Apache-2.0 OR CC-BY-4.0
    identifier: Apache-2.0 OR CC-BY-4.0
servers:
  - url: http://localhost:8080
    description: A local instance on the default `listen` address.
security:
  - bearerAuth: [read]
tags:
  - name: watches
    description: What to watch upstream. Mirrors `watches[]` of the watch file.
  - name: versions
    description: The known versions of a watch's target (read-only).
  - name: events
    description: The immutable release event log, by cursor or as a stream.
  - name: consumers
    description: Durable server-side event cursors, advanced only by an explicit ack.
  - name: sinks
    description: Where deliveries go. Mirrors `sinks[]` of the watch file.
  - name: secrets
    description: Secret values stored encrypted at rest, write-only, referenced from configuration by name (`*_ref` keys).
  - name: subscriptions
    description: Which events go to which sink. Mirrors `subscriptions[]` of the watch file.
  - name: deliveries
    description: One delivery per event and matching subscription, with its retry state, the dead-letter view and replay.
  - name: plugins
    description: Installed source and sink kinds (read-only).
  - name: tokens
    description: API tokens (`ang_...`), one scope each. The secret is returned once, when the token is created.
  - name: me
    description: The caller's own principal, token or browser session.
  - name: sessions
    description: Browser sessions of the admin web UI, signed in with an identity provider (GitHub).
  - name: access
    description: The instance's `ui.access` list, who may sign in to the admin web UI and with which role (read-only).
  - name: templates
    description: Render a message template against an event without delivering anything.
  - name: adoptions
    description: Hand resources loaded from a watch file over to the API, in place.

paths:
  /v1/watches:
    get:
      operationId: listWatches
      summary: List watches
      description: Watches in ascending `name` order, one page at a time.
      tags: [watches]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/LabelFilter'
      responses:
        '200':
          description: One page of watches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchPage'
              examples:
                page:
                  $ref: '#/components/examples/WatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/watches/{name}:
    parameters:
      - $ref: '#/components/parameters/WatchName'
    get:
      operationId: getWatch
      summary: Get a watch
      description: The watch with every default filled in, so that sending it back with `PUT` changes nothing.
      tags: [watches]
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The watch.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
              examples:
                watch:
                  $ref: '#/components/examples/Watch'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putWatch
      summary: Create or replace a watch
      description: |
        Idempotent upsert keyed by `name` (the apply operation). The body replaces the whole watch;
        omitted optional keys take their defaults. Sending the same body twice changes nothing the
        second time (`Angelia-Change: unchanged`).

        Changing `source` or `coordinates` points the watch at another target and resets its
        baseline; changing only `labels`, `policy`, `scheme` or `interval` keeps it. Coordinates are
        stored in the source's canonical form, so the response may spell them differently
        (`Requests` becomes `requests` on PyPI). Names are unique per resource type: a name already
        used by a watch from the watch file is refused with `409 managed-by-file`.

        A request that adds, removes or changes a `*_ref` key (a reference to a stored secret)
        needs the `admin` scope; a `write` token gets `403` with `required_scope: admin`.

        Optimistic concurrency: `If-Match` with the `ETag` of a `GET` (or of a previous `PUT`)
        writes only if the watch is still that version, else `412 precondition-failed`;
        `If-None-Match: *` creates only, and gets `412` if the watch exists. Both are optional:
        without them the last write wins.
      tags: [watches]
      security:
        - bearerAuth: [write]
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchWrite'
            examples:
              watch:
                $ref: '#/components/examples/WatchPut'
      responses:
        '200':
          description: The watch existed; it was updated, or was already identical.
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
              examples:
                watch:
                  $ref: '#/components/examples/Watch'
        '201':
          description: The watch was created.
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
              examples:
                watch:
                  $ref: '#/components/examples/WatchCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteWatch
      summary: Delete a watch
      description: |
        No new events or deliveries are created for the watch. Its events and deliveries are kept
        as history until retention prunes them. The target and its known versions are deleted
        when no other watch uses them.

        With `If-Match`, the watch is deleted only if it is still that version, else
        `412 precondition-failed`.
      tags: [watches]
      security:
        - bearerAuth: [write]
      parameters:
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The watch was deleted (or, with `dry_run=true`, would be).
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/watches/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/WatchName'
    get:
      operationId: listWatchVersions
      summary: List the known versions of a watch
      description: |
        The versions the instance knows for the watch's target, greatest first in the order of the
        watch's version scheme. The known set never shrinks: a version that disappeared upstream
        has `removed_at` set. The watch's policy is not applied: this is what upstream has, not
        what was emitted (use `GET /v1/events?watch=` for that).
      tags: [versions]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: prerelease
          in: query
          description: Only pre-releases (`true`) or only final releases (`false`). Absent means both.
          schema:
            type: boolean
          example: false
        - name: yanked
          in: query
          description: Only yanked versions (`true`) or only versions that are not yanked (`false`). Absent means both.
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
              examples:
                page:
                  $ref: '#/components/examples/VersionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/events:
    get:
      operationId: listEvents
      summary: Pull events after a cursor, or the newest events
      description: |
        The pull API. Events in commit order, starting after the cursor `after` (an event's `seq`).
        To resume after downtime, pass the `next_after` of the previous page: no committed event is
        skipped. `next_after` is the highest `seq` scanned, so filters that skip many events do
        not make the client scan them again. The scan per request is bounded: a page may be empty
        with `has_more` true.

        Events older than the retention period (90 days by default) are pruned. A non-zero `after`
        below the highest pruned `seq` is refused with `410 cursor-expired` and `oldest_seq`;
        `after=0` always starts at the oldest event kept.

        With `consumer`, the server keeps the cursor: the page starts after the consumer's
        `acked_seq` and uses the consumer's stored filter, exactly as `after=<acked_seq>` with
        that filter would. `consumer` cannot be combined with `after`, `watch`, `type` or `source`:
        exclusivity is by presence, so `consumer` with `after=0` or an empty `watch=` also gets
        `400 bad-request`. An unknown consumer gets `404`, and a consumer whose `acked_seq` is
        below the highest pruned `seq` gets `410 cursor-expired`; unlike `after=0`, an `acked_seq`
        of `0` is checked like any other position. Reading never acknowledges: the
        client acknowledges with `POST /v1/consumers/{name}/ack` (for example the page's
        `next_after`) once it has processed the page.

        With `order=desc`, the page lists the newest events first, starting at the head of the log,
        or below `before` (an event's `seq`, exclusive) for the next page: pass the page's
        `next_before`. The filters apply as in commit order, and the scan is bounded the same way,
        so a page may be empty with `has_more` true. `next_after` is the highest `seq` the page
        scanned, so a client that shows the newest events can then follow new ones with
        `after=<next_after>` or the event stream. Reading backwards ends at the oldest event kept:
        it never gets `410`. `order=desc` cannot be combined with `after` or `consumer`, and
        `before` needs `order=desc` (`400`).
      tags: [events]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/EventLimit'
        - $ref: '#/components/parameters/WatchFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/ConsumerParam'
        - $ref: '#/components/parameters/EventOrder'
        - $ref: '#/components/parameters/Before'
      responses:
        '200':
          description: The events after the cursor, oldest first; with `order=desc`, the newest events below `before`, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                page:
                  $ref: '#/components/examples/EventPage'
                newestFirst:
                  $ref: '#/components/examples/EventPageNewestFirst'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/events/stream:
    get:
      operationId: streamEvents
      summary: Stream events (server-sent events)
      description: |
        The same events as `GET /v1/events`, with the same filters, as a
        [server-sent events](https://html.spec.whatwg.org/multipage/server-sent-events.html) stream.
        The server first sends the events after the cursor, then each new event as it is committed.

        - The stream starts with `retry: 5000` (reconnect after 5 seconds).
        - Each event is one SSE message: `id` is the event's `seq`, `data` is the same
          `EventRecord` as in `GET /v1/events` (`seq`, `event`, `ref_event_id`) as one line of
          JSON. There is no `event` field (the message type is the default `message`).
        - A reconnecting client sends `Last-Event-ID`; it takes precedence over `after`. An expired
          cursor is refused before the stream starts, with `410 cursor-expired` (problem details,
          not a stream).
        - With `consumer`, the stream starts after the consumer's `acked_seq` and uses its stored
          filter; `Last-Event-ID` still takes precedence over `acked_seq`. As on `GET /v1/events`,
          `consumer` cannot be present with `after`, `watch`, `type` or `source` (`400`), an
          unknown consumer gets `404`, and an expired cursor gets `410` before the stream starts.
          The consumer is read once, when the stream starts: an open stream keeps the filter as it
          was then (watch names resolved once), and a later `PUT` or `DELETE` of the consumer
          does not affect it. The stream never acknowledges: the client calls
          `POST /v1/consumers/{name}/ack`.
        - The server sends a comment line (`: keep-alive`) when nothing else was sent for 15 seconds.
        - A token is sent in the `Authorization` header, which the browser `EventSource` API cannot
          set: a client with a token uses a fetch-based SSE client. The admin web UI, served by the
          instance on the same origin, authenticates with its session cookie instead, so a plain
          `EventSource` works there (a `GET` needs no CSRF header). The credential, token or
          session, is checked again at least every 60 seconds: once it is revoked or the session
          ends, the server closes the stream.
      tags: [events]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/WatchFilter'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/ConsumerParam'
        - name: Last-Event-ID
          in: header
          description: The `seq` of the last event the client received. Takes precedence over `after` and over a consumer's `acked_seq`.
          schema:
            $ref: '#/components/schemas/Seq'
          example: 4182
      responses:
        '200':
          description: An open event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE messages, each with `id` (the event's `seq`) and `data` (an `EventRecord` as one line of JSON).
              examples:
                stream:
                  $ref: '#/components/examples/EventStream'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The event id (the CloudEvents `id`, a ULID).
        schema:
          $ref: '#/components/schemas/Ulid'
        example: 01JBX2A7C8D9E0F1G2H3J4K5M6
    get:
      operationId: getEvent
      summary: Get an event
      description: One event by its CloudEvents id.
      tags: [events]
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRecord'
              examples:
                event:
                  $ref: '#/components/examples/EventRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/consumers:
    get:
      operationId: listConsumers
      summary: List consumers
      description: Consumers in ascending `name` order, one page at a time, each with its cursor (`acked_seq`).
      tags: [consumers]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of consumers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerPage'
              examples:
                page:
                  $ref: '#/components/examples/ConsumerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/consumers/{name}:
    parameters:
      - $ref: '#/components/parameters/ConsumerName'
    get:
      operationId: getConsumer
      summary: Get a consumer
      description: The consumer with its stored filter and its cursor (`acked_seq`, `acked_at`).
      tags: [consumers]
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
              examples:
                consumer:
                  $ref: '#/components/examples/Consumer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putConsumer
      summary: Create or update a consumer
      description: |
        Idempotent upsert keyed by `name`. A consumer is a durable, server-side event cursor:
        `GET /v1/events?consumer=` and `GET /v1/events/stream?consumer=` read the events after
        its `acked_seq` with its stored `filter`, and only `POST /v1/consumers/{name}/ack` moves
        the cursor. Reading never acknowledges.

        The body replaces the whole `filter` (an omitted `filter` matches every event). `start`
        applies only when the consumer is created: `latest` (the default) sets `acked_seq` to
        the highest `seq` ever committed (pruned events included) when the create commits, so the consumer
        receives only events committed after it (an event committed concurrently with the create
        may or may not be included); `earliest` sets it to the highest pruned `seq` (`0` on a log
        that was never pruned), so the consumer starts at the oldest event kept. On an existing consumer `start` is
        ignored, and no `PUT` ever moves `acked_seq`: changing the filter applies to the events
        after the current cursor only. Sending the same filter twice changes nothing the second
        time (`Angelia-Change: unchanged`).
      tags: [consumers]
      security:
        - bearerAuth: [write]
      parameters:
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerWrite'
            examples:
              consumer:
                $ref: '#/components/examples/ConsumerPut'
              fromEarliest:
                $ref: '#/components/examples/ConsumerPutEarliest'
      responses:
        '200':
          description: The consumer existed; its filter was updated, or was already identical. Its cursor is unchanged.
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
              examples:
                consumer:
                  $ref: '#/components/examples/Consumer'
        '201':
          description: The consumer was created, with its cursor at the `start` position.
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
              examples:
                created:
                  $ref: '#/components/examples/ConsumerCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteConsumer
      summary: Delete a consumer
      description: Deletes the consumer and its cursor. Events are not affected; retention never waits for consumers.
      tags: [consumers]
      security:
        - bearerAuth: [write]
      parameters:
        - $ref: '#/components/parameters/DryRun'
      responses:
        '204':
          description: The consumer was deleted (or, with `dry_run=true`, would be).
          headers:
            Angelia-Change:
              $ref: '#/components/headers/AngeliaChange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/consumers/{name}/ack:
    parameters:
      - $ref: '#/components/parameters/ConsumerName'
    post:
      operationId: ackConsumer
      summary: Acknowledge events up to a position
      description: |
        Commits the consumer's cursor: everything up to and including the given position is
        acknowledged. The body is `ConsumerAck`, exactly one of `seq` (an event's `seq`, as in
        `next_after` or an `EventRecord`) and `event_id` (an event's CloudEvents `id`, which the
        server resolves to its `seq`).

        The commit is monotonic: `acked_seq` becomes the larger of its current value and the
        given `seq`, so acknowledging the same or an older position again is a no-op that returns
        `200` with the consumer unchanged (`acked_at` included), and concurrent acks never move
        the cursor back. An acknowledged position does not have to match the consumer's filter:
        acknowledging a page's `next_after` skips the events the filter left out.

        A `seq` above the highest `seq` ever committed (pruned events included), or an `event_id` the log does not hold (never
        emitted, or already pruned), is refused with `422 validation-failed` and a pointer to the
        member. A consumer whose cursor fell behind retention (`410 cursor-expired` on read)
        recovers by acknowledging `oldest_seq − 1`, accepting the gap.
      tags: [consumers]
      security:
        - bearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerAck'
            examples:
              bySeq:
                $ref: '#/components/examples/ConsumerAckSeq'
              byEventId:
                $ref: '#/components/examples/ConsumerAckEventId'
      responses:
        '200':
          description: The consumer after the commit; unchanged when the position was not beyond its cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumer'
              examples:
                acked:
                  $ref: '#/components/examples/ConsumerAcked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

