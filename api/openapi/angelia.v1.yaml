              examples:
                dead:
                  $ref: '#/components/examples/DeliveryDead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/deliveries/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/DeliveryId'
    post:
      operationId: replayDelivery
      summary: Replay a delivery
      description: |
        Queues a `dead` or `delivered` delivery again, due now, with the same event and idempotency
        key. `attempts` keeps counting (a replay does not reset it); the retry budget starts again
        from the replay. Refused with `409` (`not-replayable`) while it is `pending` or `in_flight`,
        or when its subscription or sink no longer exists. The replay is recorded in the audit log.

        A receiver that deduplicates on the idempotency key or the event id may drop a replayed
        delivery it already accepted: replaying a `delivered` delivery is for receivers that lost
        it.
      tags: [deliveries]
      security:
        - bearerAuth: [write]
      requestBody:
        required: false
        description: No body is needed; an empty JSON object is accepted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            examples:
              empty:
                summary: No options
                value: {}
      responses:
        '200':
          description: The delivery, queued again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              examples:
                queued:
                  $ref: '#/components/examples/DeliveryReplayed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/replays:
    post:
      operationId: createReplay
      summary: Replay deliveries in bulk
      description: |
        Queues again, as `POST /v1/deliveries/{id}/replay` does, every delivery that matches the
        selector: the deliveries of one event, or the deliveries of one subscription whose event
        `time` is in `[since, until)`. Only deliveries in one of `status` (default `dead`) are
        replayed; `pending` and `in_flight` ones are never touched, and neither are deliveries whose
        subscription or sink no longer exists. With `dry_run` nothing is queued and the response
        says what would be. The replay is recorded in the audit log.
      tags: [deliveries]
      security:
        - bearerAuth: [write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
            examples:
              byEvent:
                $ref: '#/components/examples/ReplayByEvent'
              bySubscriptionAndTime:
                $ref: '#/components/examples/ReplayBySubscription'
      responses:
        '200':
          description: What was replayed (or, with `dry_run`, what would be).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResult'
              examples:
                result:
                  $ref: '#/components/examples/ReplayResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/adoptions:
    post:
      operationId: adoptResources
      summary: Hand watch-file resources over to the API
      description: |
        Changes the owner of each listed resource from `file` to `api`, in place and in one
        transaction: its `id`, its target, its known versions, its baseline, its cooldown holds and
        its pending deliveries are kept, so no release is missed or sent twice. Afterwards the API
        (and the admin UI) can change and delete it like any API resource.

        The instance remembers each adopted name. While the watch file still declares an entry
        of that kind and name, the startup apply skips it with a warning instead of failing on
        the name, so the process keeps starting until the operator removes the entry from the
        file. Once the file no longer declares it, the name is forgotten.

        The request is all or nothing. Each object must exist and be managed by the file
        (`422`). Ownership must stay consistent, as no resource may reference another owner's:
        a subscription can be adopted only with its sink (in the same request, or a sink already
        managed by the API), and a sink only with every file subscription that uses it.
        Watches have no references and can be adopted alone. With `dry_run` nothing changes and
        the response says what would be adopted. An adoption is recorded in the audit log.
      tags: [adoptions]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionRequest'
            examples:
              everything:
                $ref: '#/components/examples/AdoptionRequest'
      responses:
        '200':
          description: What was adopted (or, with `dry_run`, what would be).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionResult'
              examples:
                result:
                  $ref: '#/components/examples/AdoptionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/plugins:
    get:
      operationId: listPlugins
      summary: List plugins
      description: Every source and sink kind this instance can use, built-in or installed, in ascending `kind` order.
      tags: [plugins]
      security:
        - bearerAuth: [read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: interface
          in: query
          description: Only source kinds or only sink kinds.
          schema:
            $ref: '#/components/schemas/PluginInterface'
          example: source
      responses:
        '200':
          description: One page of plugins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPage'
              examples:
                page:
                  $ref: '#/components/examples/PluginPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/plugins/{interface}/{kind}:
    parameters:
      - name: interface
        in: path
        required: true
        description: '`source` or `sink`: a source and a sink may share a kind name.'
        schema:
          $ref: '#/components/schemas/PluginInterface'
        example: source
      - name: kind
        in: path
        required: true
        description: The kind.
        schema:
          $ref: '#/components/schemas/Kind'
        example: crates
    get:
      operationId: getPlugin
      summary: Get a plugin
      description: One source or sink kind.
      tags: [plugins]
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
              examples:
                wasm:
                  $ref: '#/components/examples/PluginWasm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/tokens:
    get:
      operationId: listTokens
      summary: List API tokens
      description: |
        API tokens in ascending `id` order (ULIDs, so oldest first): their id, name, scope, times
        and who created and revoked them, **never the token or its hash**. Revoked tokens are left
        out unless `include_revoked=true`; expired tokens are listed (they are not revoked). Needs
        the `admin` scope: the list shows who can do what.
      tags: [tokens]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeRevoked'
      responses:
        '200':
          description: One page of tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
              examples:
                page:
                  $ref: '#/components/examples/TokenPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createToken
      summary: Create an API token
      description: |
        Creates a token with the given `name`, `scope` and optional `expires_at`. The response is
        the only place the token itself (`token`, `ang_` followed by the token's id and secret) is
        ever returned: store it now, it cannot be read again. The server keeps a hash only. A
        `name` is unique among **active** (not revoked) tokens; a clash, an `expires_at` that is
        not in the future, or a `scope` that is not `read`, `write` or `admin` is
        `422 validation-failed` with a pointer to the member. Names of revoked tokens can be
        reused.
      tags: [tokens]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
            examples:
              readToken:
                $ref: '#/components/examples/TokenCreate'
              expiringAdminToken:
                $ref: '#/components/examples/TokenCreateExpiring'
      responses:
        '201':
          description: The token was created. `token` is shown this once.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
              examples:
                created:
                  $ref: '#/components/examples/TokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    get:
      operationId: getToken
      summary: Get an API token's metadata
      description: The token's id, name, scope, times and creator, revoked or not. Never the token or its hash.
      tags: [tokens]
      security:
        - bearerAuth: [admin]
      responses:
        '200':
          description: The token, without its secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              examples:
                token:
                  $ref: '#/components/examples/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: revokeToken
      summary: Revoke an API token
      description: |
        Sets `revoked_at` and `revoked_by`; the row stays, so an id is never reused. Requests that
        carry the token fail with `401` from the next request on (an open event stream fails at
        its next re-check, at most 60 seconds later). A token may revoke itself, and the last
        active admin token may be revoked. Revoking an already revoked token is `204` too and
        changes nothing. An unknown id is `404`.
      tags: [tokens]
      security:
        - bearerAuth: [admin]
      responses:
        '204':
          description: The token is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/me:
    get:
      operationId: getMe
      summary: Get the caller's principal
      description: |
        Who the request is authenticated as: an API token (`kind: token`) or a browser session of the
        admin UI (`kind: session`), with its scope. For a session, `role` is the role that the
        instance's `ui.access` list gives the user **now** (it is evaluated on every request) and
        `user` is the identity the session signed in with. The admin UI calls it first, to know whom
        to show and which controls to offer. Never returns a token, a cookie or a hash.
      tags: [me]
      security:
        - bearerAuth: [read]
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                token:
                  $ref: '#/components/examples/MeToken'
                session:
                  $ref: '#/components/examples/MeSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sessions:
    get:
      operationId: listSessions
      summary: List browser sessions
      description: |
        Browser sessions of the admin UI in ascending `id` order (ULIDs, so oldest first): who signed
        in, when, from which user agent, when the session was last used and when it ends, **never the
        cookie or its hash**. Only active sessions are listed (not revoked, not past `expires_at`, and
        used within the instance's idle timeout) unless `include_ended=true`. Needs the `admin` scope:
        the list shows who can act on the instance.
      tags: [sessions]
      security:
        - bearerAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeEnded'
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
              examples:
                page:
                  $ref: '#/components/examples/SessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeSession
      summary: Revoke a browser session
      description: |
        Sets `revoked_at` and `revoked_by`; the row stays. Requests with the session's cookie fail
        with `401` from the next request on (an open event stream fails at its next re-check, at most
        60 seconds later); the user can sign in again if `ui.access` still lists them. Revoking an
        already revoked session is `204` too and changes nothing. An unknown id is `404`.
      tags: [sessions]
      security:
        - bearerAuth: [admin]
      responses:
        '204':
          description: The session is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/access:
    get:
      operationId: listAccess
      summary: List the admin UI's access list
      description: |
        The entries of the instance's `ui.access` list, in the order of its configuration: who may
        sign in to the admin web UI and with which role. A `github_user` entry shows the numeric id
        its login is pinned to once someone signed in with it (`subject`, `pinned: true`). Read-only:
        the list is configuration, changed in the instance's configuration file and read at start.
        Never returns the OAuth client id, its secret or any other configuration. Needs `admin`:
        the list says who holds which role.
      tags: [access]
      security:
        - bearerAuth: [admin]
      responses:
        '200':
          description: The access list, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessList'
              examples:
                access:
                  $ref: '#/components/examples/AccessList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/template-previews:
    post:
      operationId: previewTemplate
      summary: Render a message template against an event
      description: |
        Renders `template` as a subscription template (or a template-valued sink key such as
        `github-dispatch`'s `event_type`) against one event and returns the output, or the error a
        delivery would get. The event is `event` (an envelope given in the request), `event_id`
        (an event of the log) or `sample` (a built-in sample event, `full` by default).

        Nothing is stored and nothing is sent. The template runs in the engine deliveries use, with
        the same functions and no network, file, environment or clock access; it sees the event only,
        so no secret can be resolved (`*_ref` and `*_env` keys are not part of the template context).
        The run is bounded more strictly than a delivery: 250 ms and 256 KiB of output.

        A template that does not parse or fails to render is a `200` with `error` set: the request
        was fine. Error reasons give a position and a fixed reason, never the template text.
      tags: [templates]
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePreviewRequest'
            examples:
              sample:
                $ref: '#/components/examples/TemplatePreviewSample'
              storedEvent:
                $ref: '#/components/examples/TemplatePreviewStoredEvent'
      responses:
        '200':
          description: The output, or the template's error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePreview'
              examples:
                rendered:
                  $ref: '#/components/examples/TemplatePreviewRendered'
                failed:
                  $ref: '#/components/examples/TemplatePreviewFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        An API token (`Authorization: Bearer <token>`). Each token has one scope; the scopes are
        ordered, and a token satisfies an operation whose scope is at or below its own:
        `read` (every `GET`), `write` (watches, subscriptions, replays, consumers and their acks), `admin` (sinks, secrets, API tokens,
        any change to a `*_ref` key, and everything else). The scope an operation needs is listed in its `security` requirement.
        The token and its scope are checked before anything else, so a `401` or `403` never
        reveals whether a resource exists.

        A token looks like `ang_<id>_<secret><check>`, 90 characters: the prefix `ang_`, the
        token's 26-character ULID (its public `id`), an underscore, 52 characters of random
        secret and a 7-character CRC-32 check, the last two in lower-case base32 (`a-z2-7`).
        check = CRC-32 (IEEE) of the ASCII bytes `ang_<id>_<secret>`, as 4 big-endian bytes,
        lower-case RFC 4648 base32 without padding.
        Scanners and log redaction can match
        `(?:^|[^A-Za-z0-9_])(ang_[0-7][0-9A-HJKMNP-TV-Z]{25}_[a-z2-7]{59})(?:$|[^A-Za-z0-9_])`.
        Tokens are created with `POST /v1/tokens` (or `angelia token create`); the token is
        returned once.

        **Browser sessions (`sessionCookie`).** A request with no `Authorization` header may instead
        carry the session cookie of the instance's admin web UI, set when a person signs in with an
        identity provider (GitHub). The session's scope comes from the role that the instance's
        `ui.access` list gives the user, evaluated on every request: `viewer` is `read`, `editor` is
        `write`, `admin` is `admin`. The same scope requirements apply as for a token; when both are
        sent, the `Authorization` header wins and the cookie is ignored. A request that changes
        something (`POST`, `PUT`, `PATCH`, `DELETE`) authenticated by the cookie also needs an
        `Origin` header equal to the origin of the instance's `ui.public_url` **and** the header
        `X-Angelia-CSRF: 1`, else it is `403 csrf`. The cookie is never accepted on the MCP endpoint.
        Operations list only `bearerAuth` in their `security` requirement: a session satisfies the
        same scope.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-angelia_session
      description: |
        The admin web UI's session cookie, `angs_<id>_<secret>` (the prefix `angs_`, the session's
        26-character ULID, an underscore and 52 characters of random secret in lower-case base32), set
        `Secure`, `HttpOnly`, `SameSite=Lax`, `Path=/` when a person signs in. The server keeps a hash
        only. An instance whose `ui.public_url` is a loopback `http://` URL (local development) names
        it `angelia_session` without `Secure`. See `bearerAuth` for the scope and the CSRF rule;
        operations do not list this scheme.

  headers:
    ETag:
      description: |
        The version of the resource, a strong entity tag. It is derived from the stored resource
        (its configuration, not its status), so it changes exactly when a write changes the
        resource, and it is the same for every caller and replica. Opaque: compare it, do not parse
        it. Send it back in `If-Match`.
      schema:
        type: string
        pattern: '^"[\x21\x23-\x7e]{1,64}"$'
      example: '"3q2-7wEAAAAAAAAAAAAAAA"'
    AngeliaChange:
      description: What the request changed (or, with `dry_run=true`, would change).
      schema:
        type: string
        enum: [created, updated, unchanged, deleted]
      example: unchanged
    Location:
      description: The URL of the created resource.
      schema:
        type: string
        format: uri-reference
      example: /v1/watches/requests
    WwwAuthenticate:
      description: The bearer challenge (RFC 6750), with `error="invalid_token"` when a token was sent but is unknown, revoked or malformed.
      schema:
        type: string
      example: Bearer realm="angelia", error="invalid_token"

  parameters:
    IfMatch:
      name: If-Match
      in: header
      description: |
        Write only if the resource's current `ETag` is one of these (comma-separated) entity tags,
        or, with `*`, only if the resource exists; else `412 precondition-failed`. Strong
        comparison: a weak tag (`W/"..."`) never matches.
      schema:
        type: string
        maxLength: 1024
        pattern: '^(\*|(W/)?"[\x21\x23-\x7e]*"([ \t]*,[ \t]*(W/)?"[\x21\x23-\x7e]*")*)$'
      example: '"3q2-7wEAAAAAAAAAAAAAAA"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: '`*`: create only. If the resource exists, the request gets `412 precondition-failed` and changes nothing. No other value is accepted.'
      schema:
        type: string
        enum: ['*']
      example: '*'
    EventOrder:
      name: order
      in: query
      description: '`asc` (the default): oldest first, after `after`. `desc`: newest first, below `before`. `desc` cannot be combined with `after` or `consumer`.'
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      example: desc
    Before:
      name: before
      in: query
      description: With `order=desc`, return the events whose `seq` is lower than this, the `next_before` of the previous page. Absent, the page starts at the newest event. Needs `order=desc`.
      schema:
        $ref: '#/components/schemas/Seq'
      example: 4182
    WatchName:
      name: name
      in: path
      required: true
      description: The watch's name.
      schema:
        $ref: '#/components/schemas/Name'
      example: requests
    SinkName:
      name: name
      in: path
      required: true
      description: The sink's name.
      schema:
        $ref: '#/components/schemas/Name'
      example: ci-webhook
    SecretName:
      name: name
      in: path
      required: true
      description: The secret's name, the value of the `*_ref` keys that reference it.
      schema:
        $ref: '#/components/schemas/Name'
      example: ci-webhook-signing
    SubscriptionName:
      name: name
      in: path
      required: true
      description: The subscription's name.
      schema:
        $ref: '#/components/schemas/Name'
      example: platform-ci
    SessionId:
      name: id
      in: path
      required: true
      description: The session's id, a ULID. Never the cookie.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JD0B6Q1W4E7R9T2Y5V8X0Z3A
    TokenId:
      name: id
      in: path
      required: true
      description: The token's id, a ULID (the `ang_` token carries it after the prefix). Never the token itself.
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JCZ8W3T6Q9N2H4K7M5R0V8XA
    ConsumerName:
      name: name
      in: path
      required: true
      description: The consumer's name.
      schema:
        $ref: '#/components/schemas/Name'
      example: release-bot
    DeliveryId:
      name: id
      in: path
      required: true
      description: The delivery id (a ULID).
      schema:
        $ref: '#/components/schemas/Ulid'
      example: 01JBX2A9QWERTY0123456789AB
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      example: 100
    IncludeRevoked:
      name: include_revoked
      in: query
      description: List revoked tokens too. Expired tokens are always listed.
      schema:
        type: boolean
        default: false
      example: false
    IncludeEnded:
      name: include_ended
      in: query
      description: List ended sessions too (revoked, past `expires_at`, or idle longer than the instance's idle timeout).
      schema:
        type: boolean
        default: false
      example: false
    Cursor:
      name: cursor
      in: query
      description: The opaque `next_cursor` of the previous page. Absent for the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
      example: eyJuIjoicmVxdWVzdHMifQ
    DryRun:
      name: dry_run
      in: query
      description: Validate and compute the result, without writing anything. The response is the one the request would get.
      schema:
        type: boolean
        default: false
      example: false
    After:
      name: after
      in: query
      description: Return the events whose `seq` is greater than this. `0` (the default) starts at the oldest event kept.
      schema:
        $ref: '#/components/schemas/Seq'
      example: 4180
    ConsumerParam:
      name: consumer
      in: query
      description: |
        Read through this consumer: start after its `acked_seq`, with its stored filter. Exclusive
        with `after`, `watch`, `type` and `source` by presence: sending any of them with `consumer`,
        even `after=0` or an empty value, gets `400`. Reading never moves
        the consumer's cursor; `POST /v1/consumers/{name}/ack` does.
      schema:
        $ref: '#/components/schemas/Name'
      example: release-bot
    EventLimit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    WatchFilter:
      name: watch
      in: query
      description: |
        Only events of these watches, each given by name or by id. A name (always lower case)
        means the watch's current id; an id (a ULID, always upper case) also matches events of a
        watch that was deleted or renamed.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/NameOrId'
      example: [requests]
    TypeFilter:
      name: type
      in: query
      description: Only events of these short types (as in a subscription filter).
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ShortEventType'
      example: [release.published, release.yanked]
    SourceFilter:
      name: source
      in: query
      description: Only watches (or events of watches) with these sources. On watches it matches the watch's `source` (a kind or a configured instance name); on events it matches `data.source`, which is always the base kind.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Kind'
      example: [pypi]
    LabelFilter:
      name: label
      in: query
      description: Only watches that carry this label with this value, as `key=value`. Repeat to require several.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,62}=.{0,253}$'
      example: [team=platform]

  responses:
    BadRequest:
      description: The request is malformed (bad JSON, an unknown query parameter, an invalid cursor, `consumer` combined with `after` or a filter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            badCursor:
              $ref: '#/components/examples/ProblemBadRequest'
            consumerExclusive:
              $ref: '#/components/examples/ProblemConsumerExclusive'
    Unauthorized:
      description: No token, or a token that is unknown, revoked, expired or malformed.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              $ref: '#/components/examples/ProblemUnauthorized'
    Forbidden:
      description: The token's scope is below the one the operation needs (`forbidden`), or a request that changes something was authenticated by the admin UI's session cookie without the CSRF headers (`csrf`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientScope:
              $ref: '#/components/examples/ProblemForbidden'
            csrf:
              $ref: '#/components/examples/ProblemCsrf'
    NotFound:
      description: No resource with this name or id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/ProblemNotFound'
    Conflict:
      description: The request conflicts with the current state (`managed-by-file`, `cross-owner-reference`, `sink-in-use`, `secret-in-use`, `not-replayable`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            managedByFile:
              $ref: '#/components/examples/ProblemManagedByFile'
            crossOwnerReference:
              $ref: '#/components/examples/ProblemCrossOwnerReference'
            sinkInUse:
              $ref: '#/components/examples/ProblemSinkInUse'
            secretInUse:
              $ref: '#/components/examples/ProblemSecretInUse'
            notReplayable:
              $ref: '#/components/examples/ProblemNotReplayable'
    PreconditionFailed:
      description: '`If-Match` names no current version of the resource, or `If-None-Match: *` found it existing (`precondition-failed`). Nothing was changed.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            preconditionFailed:
              $ref: '#/components/examples/ProblemPreconditionFailed'
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupported:
              $ref: '#/components/examples/ProblemUnsupportedMediaType'
    ValidationFailed:
      description: The body is well-formed JSON but breaks the resource's rules (`validation-failed`, every error listed in `errors`; for example a token name that an active token already has), names an environment variable the instance does not allow (`env-not-allowed`), stores a secret on an instance with no key (`secrets-key-missing`), or references an unbound secret where a host binding is mandatory (`secret-host-binding-required`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              $ref: '#/components/examples/ProblemValidation'
            tokenNameTaken:
              $ref: '#/components/examples/ProblemTokenNameTaken'
            ackUnknownEvent:
              $ref: '#/components/examples/ProblemAckUnknownEvent'
            envNotAllowed:
              $ref: '#/components/examples/ProblemEnvNotAllowed'
            secretsKeyMissing:
              $ref: '#/components/examples/ProblemSecretsKeyMissing'
            secretHostBindingRequired:
              $ref: '#/components/examples/ProblemSecretHostBindingRequired'
    InternalError:
      description: An unexpected server error. The detail never carries configuration or secrets.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              $ref: '#/components/examples/ProblemInternal'
    CursorExpired:
      description: The cursor points into events that retention already pruned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cursorExpired:
              $ref: '#/components/examples/ProblemCursorExpired'
            consumerCursorExpired:
              $ref: '#/components/examples/ProblemConsumerCursorExpired'
    PayloadTooLarge:
      description: The request body is larger than the server accepts (1 MiB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              $ref: '#/components/examples/ProblemPayloadTooLarge'
    Unavailable:
      description: The instance is starting, shutting down or draining, or its database is unreachable. Retry later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
          example: 5
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              $ref: '#/components/examples/ProblemUnavailable'

  schemas:
    Name:
      description: The stable key of a watch, sink, subscription, secret or consumer (the first three as in the watch file), or the label of an API token. Unique per resource type, whoever manages the resource (for tokens, among active tokens).
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
    Ulid:
      description: 'ULID: 26 characters, Crockford base32, upper case.'
      type: string
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
    NameOrId:
      description: A name (lower case) or a ULID id (upper case). The two never overlap.
      type: string
      pattern: '^([a-z0-9][a-z0-9._-]{0,62}|[0-7][0-9A-HJKMNP-TV-Z]{25})$'
    Kind:
      description: A source or sink kind (`pypi`, `github-release`, `webhook`, a plugin's kind, ...).
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    Timestamp:
      description: RFC 3339 timestamp in UTC with a Z suffix and at most millisecond precision (the server always sends milliseconds).
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$'
      examples: ['2026-10-30T17:00:02.512Z']
    Duration:
      description: A Go duration (`30m`, `6h`, `1h30m`, `0`). The range depends on the field; the server keeps whole seconds and cuts any fraction.
      type: string
      pattern: '^[-+]?(0|([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+)$'
    Labels:
      description: String labels. At most 32; keys `^[A-Za-z0-9][A-Za-z0-9._/-]{0,62}$`, values at most 253 characters with no control characters.
      type: object
      maxProperties: 32
      propertyNames:
        pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,62}$'
      additionalProperties:
        type: string
        maxLength: 253
        pattern: '^[^\x00-\x1F\x7F]*$'
      examples:
        - team: platform
    Cursor:
      description: An opaque page cursor. Clients pass it back unchanged and must not parse it.
      type: string
      minLength: 1
      maxLength: 512
      examples: [eyJuIjoicmVxdWVzdHMifQ]
    Seq:
      description: An event's position in the log, assigned in commit order (`event.seq`). Strictly increasing; there may be gaps.
      type: integer
      format: int64
      minimum: 0
      examples: [4182]
    ManagedBy:
      description: |
        Who owns the resource. `api`: created through this API (or `angelia apply`). `file`:
        created from a watch file loaded with `angelia serve --watches`; the API reads it but
        refuses to change or delete it (`409 managed-by-file`) until an admin adopts it with
        `POST /v1/adoptions`, which makes it `api`.
      type: string
      enum: [api, file]
    ShortEventType:
      description: An event type without the `dev.angelia.` prefix and the `.v<major>` suffix.
      type: string
      enum: [release.published, release.yanked, release.prerelease]
    Bump:
      type: string
      enum: [major, minor, patch]
    PrereleaseMode:
      description: '`none`: drop pre-releases. `only`: keep only pre-releases. `include`: keep both.'
      type: string
      enum: [none, only, include]

    WatchWrite:
      description: |
        The body of `PUT /v1/watches/{name}`: the keys of `watches[]` in the watch file. Omitted
        optional keys take their defaults.
      type: object
      required: [source, coordinates]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: Optional; when given it must equal the name in the path.
        source:
          $ref: '#/components/schemas/Kind'
          description: A registered source kind (`GET /v1/plugins?interface=source`), or the name of a source instance configured on the server (`sources.<name>.kind`). Events of the watch carry the base kind in `data.source`.
        coordinates:
          description: "Source-owned parameters that name the upstream object (`pypi`, `npm`, `crates`: `name`; `github-release`: `repo` as `owner/name`). Stored in the source's canonical form."
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        interval:
          $ref: '#/components/schemas/Duration'
          description: The requested check interval, `5m` to `720h`. Watches on one target share the smallest interval among them; `status.effective_interval` shows the one in use.
          default: 1h
        scheme:
          description: The version scheme (`semver`, `pep440`, `maven`, `calver`, `lexical`). Defaults by source kind.
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        labels:
          $ref: '#/components/schemas/Labels'
          default: {}
        policy:
          $ref: '#/components/schemas/WatchPolicy'
    Watch:
      description: |
        A watch as the server returns it: the write keys with every default filled in, plus
        response-only fields. Sending the write keys back with `PUT` changes nothing.
      type: object
      required: [name, id, managed_by, source, coordinates, interval, scheme, labels, policy, status]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated when the watch is created; kept across updates. Equals `data.watch.id` in its events.
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
        source:
          $ref: '#/components/schemas/Kind'
          description: A registered source kind (`GET /v1/plugins?interface=source`), or the name of a source instance configured on the server (`sources.<name>.kind`). Events of the watch carry the base kind in `data.source`.
        coordinates:
          description: "Source-owned parameters that name the upstream object (`pypi`, `npm`, `crates`: `name`; `github-release`: `repo` as `owner/name`). Stored in the source's canonical form."
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        interval:
          $ref: '#/components/schemas/Duration'
          description: The requested check interval, `5m` to `720h`. Watches on one target share the smallest interval among them; `status.effective_interval` shows the one in use.
          default: 1h
        scheme:
          description: The version scheme (`semver`, `pep440`, `maven`, `calver`, `lexical`). Defaults by source kind.
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        labels:
          $ref: '#/components/schemas/Labels'
          default: {}
        policy:
          $ref: '#/components/schemas/WatchPolicy'
        status:
          $ref: '#/components/schemas/WatchStatus'
    WatchPolicy:
      description: Which new versions become events. Keys and semantics as in `watches[].policy` of the watch file.
      type: object
      additionalProperties: false
      properties:
        prerelease:
          $ref: '#/components/schemas/PrereleaseMode'
          default: none
        include:
          description: RE2 regexes on the raw version; a version must match one. Empty means all. At most 16.
          type: array
          maxItems: 16
          items:
            type: string
          default: []
        exclude:
          description: RE2 regexes on the raw version; a match drops the version. Wins over `include`. At most 16.
          type: array
          maxItems: 16
          items:
            type: string
          default: []
        constraint:
          description: A version range such as `>=2 <3`, checked by the watch's scheme. Empty means any.
          type: string
          default: ''
        bump:
          description: Keep only these bumps. Empty means all.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Bump'
          default: []
        cooldown:
          $ref: '#/components/schemas/Duration'
          description: Emit a version only once it is this old, and drop it if it is yanked in between. `0` to `8760h`; a negative value is an error.
          default: '0'
        baseline:
          description: When true, the versions known at the first check are recorded without events.
          type: boolean
          default: true
    WatchStatus:
      description: Scheduling state of the watch and its target.
      type: object
      required: [baseline_done, effective_interval, last_checked_at, next_check_at, error_count]
      properties:
        baseline_done:
          description: Whether the first check (the baseline) has run.
          type: boolean
        effective_interval:
          $ref: '#/components/schemas/Duration'
          description: The interval the target is checked at, the smallest `interval` among the watches that share it.
        last_checked_at:
          description: The end of the last check of the target, or `null` before the first.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        next_check_at:
          description: When the target is next due, or `null` while unscheduled.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        error_count:
          description: Consecutive failed checks of the target (drives the backoff).
          type: integer
          minimum: 0
    WatchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Watch'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    Version:
      description: One upstream version of a watch's target, from the known set.
      type: object
      required: [version, normalized_version, prerelease, yanked, published_at, first_seen_at, removed_at]
      properties:
        version:
          description: The raw upstream version string (`data.version` in events).
          type: string
          examples: [2.33.0]
        normalized_version:
          description: The version in the scheme's normalised form (`data.normalized_version` in events).
          type: string
          examples: [2.33.0]
        prerelease:
          description: Whether the scheme (or the upstream flag) classifies it as a pre-release.
          type: boolean
        yanked:
          description: Whether upstream marks it yanked (as of the last check).
          type: boolean
        published_at:
          description: When upstream published it, or `null` when the source does not say.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
          description: When this instance first saw it.
        removed_at:
          description: When it disappeared upstream, or `null` while it is listed.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    VersionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    EventRecord:
      description: One event of the log with its cursor position. `event` is the CloudEvents envelope exactly as it was emitted and delivered.
      type: object
      required: [seq, event, ref_event_id]
      properties:
        seq:
          $ref: '#/components/schemas/Seq'
        event:
          $ref: '../schemas/release/envelope/v1.json'
          # Code generators: the server returns the stored envelope byte for
          # byte, so Go keeps it raw instead of a struct generated from the
          # external schema (oapi-codegen cannot walk its $defs).
          x-go-type: json.RawMessage
        ref_event_id:
          description: For a `release.yanked` event, the id of the event it yanks (the earlier `release.published` or `release.prerelease` of the same watch); `null` for other types.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    EventPage:
      type: object
      required: [items, next_after, has_more, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventRecord'
        next_after:
          $ref: '#/components/schemas/Seq'
          description: The cursor for the next request, the highest `seq` the server scanned, which can be beyond the last item when the filters skipped events, or the request's `after` when nothing was scanned.
        has_more:
          description: Whether the scan stopped before the end of the log (with `order=desc`, before the oldest event kept). A page can be empty with `has_more` true when the server's bounded scan found no matching event; ask again with `next_after` (with `order=desc`, `before=<next_before>`).
          type: boolean
        next_before:
          description: With `order=desc`, the cursor for the next (older) page, the lowest `seq` the server scanned, or the request's `before` when nothing was scanned; `null` with `order=asc`, and on an empty log without `before`.
          oneOf:
            - $ref: '#/components/schemas/Seq'
            - type: 'null'

    ConsumerFilter:
      description: |
        Which events a consumer reads: the keys and values of the `GET /v1/events` filters. All
        given keys must match; an empty or absent key matches every event (so an empty `type`
        means all types, unlike `SubscriptionFilter`, whose default is `release.published`).
        Stored as written; watch names are resolved at each request, as the `watch` query
        parameter is, and once per stream when a stream starts.
      type: object
      additionalProperties: false
      properties:
        watch:
          description: Watches, each by name or by id. A name means the watch's current id; an id also matches events of a watch that was deleted or renamed.
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NameOrId'
          default: []
        type:
          description: Short event types. Empty means every type.
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ShortEventType'
          default: []
        source:
          description: Source kinds, matched against the event's `data.source` (always the base kind).
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Kind'
          default: []
    ConsumerStart:
      description: |
        Where a new consumer's cursor starts. `latest`: at the highest `seq` ever committed (pruned events included)
        when the create commits, so it reads only events committed after its creation (an event
        committed concurrently may or may not be included). `earliest`: at the highest pruned
        `seq` (`0` on a log that was never pruned), so it reads from the oldest event kept.
      type: string
      enum: [latest, earliest]
    ConsumerWrite:
      description: The body of `PUT /v1/consumers/{name}`. Omitted keys take their defaults.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: Optional; when given it must equal the name in the path.
        filter:
          $ref: '#/components/schemas/ConsumerFilter'
        start:
          $ref: '#/components/schemas/ConsumerStart'
          description: Applies only when the consumer is created; ignored on an existing consumer, whose cursor a `PUT` never moves.
          default: latest
    Consumer:
      description: A consumer as the server returns it, with its cursor.
      type: object
      required: [name, id, filter, acked_seq, acked_at, created_at, updated_at]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated when the consumer is created; kept across updates.
        filter:
          $ref: '#/components/schemas/ConsumerFilter'
          description: The stored filter, every key present.
        acked_seq:
          $ref: '#/components/schemas/Seq'
          description: The cursor. Every event up to and including this `seq` is acknowledged; `?consumer=` reads the events after it. It only grows.
        acked_at:
          description: When an ack last moved `acked_seq`, or `null` if none has.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the filter was last changed by a `PUT`. An ack does not change it.
    ConsumerAck:
      description: |
        The body of `POST /v1/consumers/{name}/ack`: exactly one of `seq` and `event_id`.
        Everything up to and including that position is acknowledged.
      type: object
      additionalProperties: false
      properties:
        seq:
          $ref: '#/components/schemas/Seq'
          description: An event's `seq`, or a page's `next_after`. At most the highest `seq` ever committed (pruned events included), so `oldest_seq − 1` is accepted on a log whose every event was pruned.
        event_id:
          $ref: '#/components/schemas/Ulid'
          description: An event's CloudEvents `id`; the server acknowledges up to that event's `seq`. The event must still be in the log.
      oneOf:
        - required: [seq]
        - required: [event_id]
    ConsumerPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Consumer'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    TokenCreate:
      description: |
        The body of `POST /v1/tokens`. `name` is a label for operators and must be unique among
        active tokens; `scope` is the token's one scope; `expires_at`, when given, must be in the
        future. A token with no `expires_at` never expires.
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: An operator label, unique among tokens that are not revoked. It is not a key, since tokens are addressed by `id`.
        scope:
          $ref: '#/components/schemas/TokenScope'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the token stops working, in the future. Absent means never.
    TokenScope:
      description: The one scope of a token; the scopes are ordered `read` < `write` < `admin`.
      type: string
      enum: [read, write, admin]
    TokenActor:
      description: Who created or revoked a token or a session, an API token's id, a signed-in user's principal id (`<provider>:<subject>`, such as `github:139323`), or `bootstrap` (the bootstrap file) or `local` (an instance-side command).
      type: string
      pattern: '^([0-7][0-9A-HJKMNP-TV-Z]{25}|bootstrap|local|[a-z][a-z0-9-]{0,31}:[!-~]{1,255})$'
    Token:
      description: |
        An API token as the server returns it: metadata only. No scope, flag or parameter returns
        the token or its hash, except the one `201` of `POST /v1/tokens` (`TokenCreated`).
      type: object
      required: [id, name, scope, created_at, created_by, expires_at, last_used_at, revoked_at, revoked_by]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated when the token is created, never reused. It is the ULID inside the `ang_` token, so a leaked token found by a scanner can be revoked by id.
        name:
          $ref: '#/components/schemas/Name'
        scope:
          $ref: '#/components/schemas/TokenScope'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/TokenActor'
        expires_at:
          description: When the token stops working, or `null` if it never expires. An expired token is `401`, like an unknown one, and stays listed.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          description: When the token last authenticated a request, or `null` if it never has. Accurate to about 5 minutes, and a crash can lose the last interval.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_at:
          description: When the token was revoked, or `null` while it is active.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_by:
          description: Who revoked the token, or `null` while it is active.
          oneOf:
            - $ref: '#/components/schemas/TokenActor'
            - type: 'null'
    TokenCreated:
      description: |
        The `201` response of `POST /v1/tokens`: the `Token` plus `token`, the one place the
        secret is ever returned. It is shown once and cannot be read again; the server keeps a hash.
        The member is deliberately named `token`: a Spectral rule allows it on this schema only.
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          required: [token]
          properties:
            token:
              description: |
                The API token, to send as `Authorization: Bearer <token>`: `ang_`, the token's `id`,
                `_`, 52 characters of random secret and a 7-character CRC-32 check (90 characters,
                lower-case base32 after the id). Store it now.
              type: string
              minLength: 90
              maxLength: 90
              pattern: '^ang_[0-7][0-9A-HJKMNP-TV-Z]{25}_[a-z2-7]{59}$'
              readOnly: true
    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    PrincipalId:
      description: Who a request is authenticated as, in logs and the audit trail. An API token's id, or a signed-in user's `<provider>:<subject>` (such as `github:139323`), which stays the same when the user renames their login.
      type: string
      pattern: '^([0-7][0-9A-HJKMNP-TV-Z]{25}|[a-z][a-z0-9-]{0,31}:[!-~]{1,255})$'
    UiRole:
      description: A role of the instance's `ui.access` list. `viewer` has the `read` scope, `editor` `write`, `admin` `admin`.
      type: string
      enum: [viewer, editor, admin]
    SessionUser:
      description: The identity a browser session signed in with, as the identity provider reported it at sign-in.
      type: object
      required: [provider, subject, login, name, avatar_url]
      properties:
        provider:
          description: The identity provider; today `github`.
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          examples: [github]
        subject:
          description: The provider's stable id of the user (for GitHub, the numeric user id as a string). It never changes; the principal id is `<provider>:<subject>`.
          type: string
          pattern: '^[!-~]{1,255}$'
          examples: ['139323']
        login:
          description: The user's login at sign-in (GitHub's `login`). A login can be renamed and later taken by another account; `subject` cannot.
          type: string
          minLength: 1
          maxLength: 255
          examples: [mmornati]
        name:
          description: The user's display name at sign-in, or `null` if they have none.
          oneOf:
            - type: string
              maxLength: 255
            - type: 'null'
        avatar_url:
          description: The URL of the user's avatar at sign-in, or `null`.
          oneOf:
            - type: string
              format: uri
              maxLength: 2048
            - type: 'null'
    Me:
      description: |
        The caller of `GET /v1/me`. `role`, `user` and `session_id` are `null` for an API token.
      type: object
      required: [principal_id, name, scope, kind, role, user, session_id]
      properties:
        principal_id:
          $ref: '#/components/schemas/PrincipalId'
        name:
          description: The token's name, or the signed-in user's login.
          type: string
          maxLength: 255
        scope:
          $ref: '#/components/schemas/TokenScope'
        kind:
          description: How the request was authenticated, an API token (`token`) or the admin UI's session cookie (`session`).
          type: string
          enum: [token, session]
        role:
          description: For a session, the user's role in `ui.access` now; `null` for a token.
          oneOf:
            - $ref: '#/components/schemas/UiRole'
            - type: 'null'
        user:
          description: For a session, who signed in; `null` for a token.
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        session_id:
          description: For a session, its `id`, the one `GET /v1/sessions` lists (so the UI can mark the current session and offer to revoke the others); `null` for a token. Never the cookie.
          oneOf:
            - $ref: '#/components/schemas/Ulid'
            - type: 'null'
    Session:
      description: |
        A browser session of the admin UI as the server returns it: metadata only, never the cookie
        or its hash.
      type: object
      required: [id, user, user_agent, created_at, last_seen_at, expires_at, revoked_at, revoked_by]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated at sign-in, never reused. It is the ULID inside the session cookie.
        user:
          $ref: '#/components/schemas/SessionUser'
        user_agent:
          description: The `User-Agent` of the browser that signed in (cut to 256 characters), or `null`.
          oneOf:
            - type: string
              maxLength: 256
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the user signed in.
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the session last authenticated a request. Accurate to about 5 minutes, and a crash can lose the last interval. The session ends once it is unused for the instance's idle timeout.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the session ends whatever its use (sign-in plus the instance's maximum session lifetime).
        revoked_at:
          description: When the session was revoked (by an admin, or because the user signed out), or `null`.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        revoked_by:
          description: Who revoked the session (the user's own principal id when they signed out), or `null`.
          oneOf:
            - $ref: '#/components/schemas/TokenActor'
            - type: 'null'
    SessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AccessEntry:
      description: |
        One entry of the instance's `ui.access` list. An entry names one person of an identity
        provider, by login or by the provider's numeric id, and gives a role; a person listed
        several times gets the highest role. Never carries OAuth configuration or secrets.
      type: object
      required: [provider, kind, login, subject, pinned, role]
      properties:
        provider:
          description: The identity provider; today `github`.
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          examples: [github]
        kind:
          description: What the entry names. Today always `user`; later kinds (such as a team or an organisation) may be added, so clients must accept other values.
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
          examples: [user]
        login:
          description: The login the entry names, in lower case (`github_user`), or `null` for an entry by id (`github_id`).
          oneOf:
            - type: string
              minLength: 1
              maxLength: 255
            - type: 'null'
        subject:
          description: The provider's id of the person (for GitHub the numeric user id, as a string). For an entry by id, that id; for an entry by login, the id the login was pinned to at its first sign-in, or `null` while nobody has signed in with it.
          oneOf:
            - type: string
              pattern: '^[!-~]{1,255}$'
            - type: 'null'
        pinned:
          description: Whether `subject` comes from the pin of a login entry. Once pinned, only that id gets the role, even if the login is renamed and taken by another account.
          type: boolean
        role:
          $ref: '#/components/schemas/UiRole'
    AccessList:
      type: object
      required: [items]
      properties:
        items:
          description: The entries, in the order of the configuration.
          type: array
          items:
            $ref: '#/components/schemas/AccessEntry'

    SinkWrite:
      description: |
        The body of `PUT /v1/sinks/{name}`: the keys of `sinks[]` in the watch file. It carries no
        secret values: a secret is named by a `*_ref` or `*_env` key of `config`.
      type: object
      required: [kind, config]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: Optional; when given it must equal the name in the path.
        kind:
          $ref: '#/components/schemas/Kind'
          description: A registered sink kind (`GET /v1/plugins?interface=sink`).
        config:
          $ref: '#/components/schemas/SinkConfig'
    Sink:
      description: |
        A sink as the server returns it, with every default filled in. Below the `admin` scope,
        every URL in `config` is cut to `scheme://host` and `url_redacted` is true. For every
        caller, a key the kind's `config_schema` marks `x-angelia-secret: true` is replaced by
        `[REDACTED]` and listed in `masked_fields`.
      type: object
      required: [name, id, managed_by, kind, config, url_redacted, masked_fields]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated when the sink is created; kept across updates.
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
        kind:
          $ref: '#/components/schemas/Kind'
          description: A registered sink kind (`GET /v1/plugins?interface=sink`).
        config:
          $ref: '#/components/schemas/SinkConfig'
        url_redacted:
          description: Whether the URLs in `config` were cut to `scheme://host` because the token's scope is below `admin`.
          type: boolean
        masked_fields:
          description: The `config` keys replaced by `[REDACTED]` because the kind marks them secret, sorted.
          type: array
          items:
            type: string
    SinkConfig:
      description: |
        Kind-owned configuration, free-form here and validated against the kind's `config_schema`
        (`GET /v1/plugins/sink/{kind}`); unknown keys are errors. No secret values: a secret is
        named by a `*_ref` key (the name of a stored secret, `/v1/secrets`) or by a `*_env` key
        (an environment variable of the instance, as in the watch file); a `*_env` name set
        through the API must be allowed by the instance configuration (`422 env-not-allowed`).
        `*_ref` and `*_env` values are names, never secrets, and are returned as written. A key
        the `config_schema` marks `x-angelia-destination: true` is the URL a referenced secret is
        sent to, checked against the secret's `hosts`. A reference key the `config_schema` marks
        `x-angelia-secret-destination: true` names a secret whose whole value is the destination
        (a `shoutrrr` service URL): the server checks the HTTP hosts derived from that value against
        the SSRF guard and the secret's `hosts` at every delivery. A key the `config_schema` marks
        `x-angelia-secret: true` cannot be set through the API. The configuration of each built-in kind is listed in
        `x-angelia-kind-config`.
      type: object
      additionalProperties: true
      x-angelia-kind-config:
        webhook:
          $ref: '#/components/schemas/WebhookSinkConfig'
        github-dispatch:
          $ref: '#/components/schemas/GithubDispatchSinkConfig'
        shoutrrr:
          $ref: '#/components/schemas/ShoutrrrSinkConfig'
    SinkPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sink'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    SecretWrite:
      description: |
        The body of `PUT /v1/secrets/{name}`: exactly one of `value` (text) and `value_base64` (any
        bytes), at most 64 KiB once decoded, and optional `hosts`. Both value members are
        write-only: no response, log, audit record or problem detail ever carries them.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: Optional; when given it must equal the name in the path.
        value:
          description: The secret as text, stored as its UTF-8 bytes exactly (nothing is trimmed). 1 byte to 64 KiB.
          type: string
          minLength: 1
          writeOnly: true
        value_base64:
          description: The secret as the standard base64 encoding of its bytes (RFC 4648 section 4, padded). 1 byte to 64 KiB once decoded.
          type: string
          minLength: 4
          writeOnly: true
        hosts:
          description: |
            The hosts the secret may be sent to (the host binding). Each entry is `host` (port
            443) or `host:port`: a lower-case hostname (IDNA as punycode, no trailing dot) or an IP
            literal (`[addr]:port` for IPv6 with a port); no wildcards. A bound secret is resolved
            only for a destination whose host and port equal an entry, and every request that
            carries it is checked again, including each redirect hop. Empty or absent: unbound,
            and only the `admin` scope needed to reference it guards where it goes. A secret
            referenced from a source or registry credential must be bound
            (`422 secret-host-binding-required`). Sinks follow no redirect, so for a sink the
            check is made against the URL its kind marks `x-angelia-destination`, at every
            delivery. Source and registry credentials cannot reference stored secrets yet (core
            #111); the mandatory binding and the redirect re-check apply to them from then.
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 261
          default: []
      anyOf:
        - required: [value]
        - required: [value_base64]
      not:
        required: [value, value_base64]
    Secret:
      description: |
        A stored secret as the server returns it: metadata only. No scope, flag or parameter
        returns its value.
      type: object
      required: [name, hosts, key_id, created_at, updated_at, referenced_by]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        hosts:
          description: The host binding, as written; empty when the secret is unbound.
          type: array
          items:
            type: string
        key_id:
          description: The id of the key that encrypted the value (16 hex digits); it changes when `angelia secrets rotate` re-encrypts the value under a new key.
          type: string
          pattern: '^[0-9a-f]{16}$'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the value or the hosts were last written.
        referenced_by:
          description: The configuration that references the secret with a `*_ref` key, sorted by resource, name and pointer.
          type: array
          items:
            $ref: '#/components/schemas/SecretReferrer'
    SecretReferrer:
      type: object
      required: [resource, name, pointer]
      properties:
        resource:
          description: The kind of resource that holds the reference.
          type: string
          enum: [sink, watch, subscription]
        name:
          $ref: '#/components/schemas/Name'
        pointer:
          description: JSON Pointer (RFC 6901) to the `*_ref` key in the resource.
          type: string
          examples: [/config/secret_ref]
    SecretPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    SubscriptionWrite:
      description: The body of `PUT /v1/subscriptions/{name}`. Same keys as `subscriptions[]` in the watch file.
      type: object
      required: [sink]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: Optional; when given it must equal the name in the path.
        sink:
          $ref: '#/components/schemas/Name'
          description: The name of an existing sink managed like this subscription (`managed_by` must match, else `409 cross-owner-reference`).
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        policy:
          $ref: '#/components/schemas/SubscriptionPolicy'
        template:
          description: A Go `text/template` over the event (`.data.package`, ...). Empty sends the CloudEvents JSON. Checked against the sample events when written.
          type: string
          maxLength: 32768
          default: ''
    Subscription:
      description: A subscription as the server returns it, with every default filled in.
      type: object
      required: [name, id, managed_by, sink, filter, policy, template]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        id:
          $ref: '#/components/schemas/Ulid'
          description: Generated when the subscription is created; kept across updates. Part of the idempotency key of its deliveries.
        managed_by:
          $ref: '#/components/schemas/ManagedBy'
        sink:
          $ref: '#/components/schemas/Name'
          description: The name of an existing sink managed like this subscription (`managed_by` must match, else `409 cross-owner-reference`).
        filter:
          $ref: '#/components/schemas/SubscriptionFilter'
        policy:
          $ref: '#/components/schemas/SubscriptionPolicy'
        template:
          description: A Go `text/template` over the event (`.data.package`, ...). Empty sends the CloudEvents JSON. Checked against the sample events when written.
          type: string
          maxLength: 32768
          default: ''
    SubscriptionFilter:
      description: All given keys must match. An empty filter matches every `release.published` event.
      type: object
      additionalProperties: false
      properties:
        source:
          description: Source kinds. Empty means any.
          type: array
          items:
            $ref: '#/components/schemas/Kind'
          default: []
        labels:
          $ref: '#/components/schemas/Labels'
          description: The event's watch must carry all of these labels with equal values.
          default: {}
        bump:
          description: Bumps. Empty means any. Narrows the watch's `policy.bump`.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Bump'
          default: []
        package:
          description: A glob (Go `path.Match` syntax) on the package name. Empty means any.
          type: string
          default: ''
        type:
          description: Short event types.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ShortEventType'
          default: [release.published]
    SubscriptionPolicy:
      description: Narrows the watch's policy for this subscription only; it can never widen it.
      type: object
      additionalProperties: false
      properties:
        prerelease:
          description: Intersected with what the watch admits. `null` inherits the watch's mode.
          oneOf:
            - $ref: '#/components/schemas/PrereleaseMode'
            - type: 'null'
          default: null
        cooldown:
          $ref: '#/components/schemas/Duration'
          description: The effective hold is the larger of this and the watch's cooldown, counted from the same start. Clamped to `0` to `8760h` (a negative value becomes `0`), as in the watch file.
          default: '0'
    SubscriptionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    DeliveryStatus:
      description: '`pending`: queued or held, due at `next_attempt_at`. `in_flight`: being sent. `delivered`: the sink accepted it. `dead`: given up (the dead-letter state); replayable.'
      type: string
      enum: [pending, in_flight, delivered, dead]
    Delivery:
      description: One event sent to one subscription, with its retry state.
      type: object
      required:
        - id
        - event_id
        - subscription_id
        - subscription_name
        - sink
        - idempotency_key
        - status
        - attempts
        - next_attempt_at
        - held_until
        - last_error
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        event_id:
          $ref: '#/components/schemas/Ulid'
          description: The CloudEvents `id` of the event.
        subscription_id:
          $ref: '#/components/schemas/Ulid'
        subscription_name:
          description: The subscription's current name, or `null` once it was deleted.
          oneOf:
            - $ref: '#/components/schemas/Name'
            - type: 'null'
        sink:
          description: The name of the sink the subscription delivers to now, or `null` once the subscription was deleted. A subscription moved to another sink shows the new one.
          oneOf:
            - $ref: '#/components/schemas/Name'
            - type: 'null'
        idempotency_key:
          description: '`<event id>:<subscription id>`; the same on every attempt and replay.'
          type: string
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}:[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          description: Attempts started so far, replays included; a replay does not reset it.
          type: integer
          minimum: 0
        next_attempt_at:
          description: When a `pending` delivery is next due; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        held_until:
          description: The end of a cooldown hold, when the delivery is held; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_error:
          description: The last failure, with URLs cut down to scheme and host, at most 1 KiB; `null` when there was none.
          type: [string, 'null']
          maxLength: 1024
    DeliveryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ReplayRequest:
      description: |
        Which deliveries to queue again: give `event`, or `subscription` with `since` and `until`
        (both may also be combined with `event`).
      type: object
      additionalProperties: false
      properties:
        event:
          $ref: '#/components/schemas/Ulid'
          description: The deliveries of this event.
        subscription:
          $ref: '#/components/schemas/NameOrId'
          description: The deliveries of this subscription, by name or id.
        since:
          $ref: '#/components/schemas/Timestamp'
          description: Inclusive lower bound on the event `time`. Requires `subscription` and `until`.
        until:
          $ref: '#/components/schemas/Timestamp'
          description: Exclusive upper bound on the event `time`. Requires `subscription` and `since`.
        status:
          description: Replay only deliveries in these states.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [dead, delivered]
          default: [dead]
        dry_run:
          description: Compute what would be replayed without queuing anything.
          type: boolean
          default: false
      anyOf:
        - required: [event]
        - required: [subscription, since, until]
    AdoptionObject:
      description: One resource to adopt, by kind and name.
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [sink, watch, subscription]
        name:
          $ref: '#/components/schemas/Name'
    AdoptionRequest:
      description: The watch-file resources to hand over to the API.
      type: object
      additionalProperties: false
      required: [objects]
      properties:
        objects:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdoptionObject'
        dry_run:
          description: Check the request and say what would be adopted, without changing anything.
          type: boolean
          default: false
    AdoptedObject:
      type: object
      required: [kind, name, id]
      properties:
        kind:
          type: string
          enum: [sink, watch, subscription]
        name:
          $ref: '#/components/schemas/Name'
        id:
          $ref: '#/components/schemas/Ulid'
    AdoptionResult:
      type: object
      required: [dry_run, adopted]
      properties:
        dry_run:
          type: boolean
        adopted:
          description: The adopted resources (or, with `dry_run`, those that would be), sinks first, then watches, then subscriptions, each by name.
          type: array
          items:
            $ref: '#/components/schemas/AdoptedObject'
    ReplayResult:
      type: object
      required: [replayed, dry_run, deliveries, truncated]
      properties:
        replayed:
          description: How many deliveries were queued again (or would be).
          type: integer
          minimum: 0
        dry_run:
          type: boolean
        deliveries:
          description: The first 100 of them, oldest event first, as they are after the replay.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Delivery'
        truncated:
          description: Whether `deliveries` lists fewer than `replayed`.
          type: boolean

    PluginInterface:
      description: Which core interface the plugin implements.
      type: string
      enum: [source, sink]
    Plugin:
      description: A source or sink kind the instance can use.
      type: object
      required: [kind, interface, runtime, version, abi, config_schema, allowed_hosts]
      properties:
        kind:
          $ref: '#/components/schemas/Kind'
        interface:
          $ref: '#/components/schemas/PluginInterface'
        runtime:
          description: '`builtin`: compiled into the binary. `wasm`: a WASM plugin. Open set: later runtimes may be added.'
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          examples: [wasm]
        version:
          description: The plugin's version from its manifest; for a built-in, the Angelia version. `null` when unknown.
          type: [string, 'null']
          examples: [0.3.1]
        abi:
          description: For a third-party plugin, the host ABI it was built against (for WASM, the import module name); `null` for built-ins.
          type: [string, 'null']
          examples: ['angelia:host/v0']
        config_schema:
          description: The JSON Schema of the kind's configuration (a watch's `coordinates` for a source, a sink's `config` for a sink), or `null` when the kind does not publish one. A property with `x-angelia-secret` true holds a secret value; the server masks it in every response and refuses it in API writes.
          oneOf:
            - $ref: '#/components/schemas/JsonSchema'
            - type: 'null'
        allowed_hosts:
          description: For a third-party plugin, the hosts it may reach (manifest and operator entries merged); empty for built-ins, which use the instance's network rules.
          type: array
          items:
            $ref: '#/components/schemas/PluginHost'
    JsonSchema:
      description: |
        A JSON Schema document of the 2020-12 dialect (https://json-schema.org/draft/2020-12/schema),
        as an object (never the boolean forms `true` or `false`). Any keyword of the dialect may
        appear, and the `x-angelia-*` annotations of docs/api.md; clients that build a form from it
        should ignore keywords they do not know. The members below are the ones a client most often
        reads.
      type: object
      additionalProperties: true
      properties:
        $schema:
          description: The dialect, `https://json-schema.org/draft/2020-12/schema`, when the document declares one; absent means the same dialect.
          type: string
          enum: ['https://json-schema.org/draft/2020-12/schema']
        type:
          description: A JSON type name, or a list of them.
        description:
          type: string
        properties:
          description: The schema of each member of an object.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonSchema'
        required:
          type: array
          items:
            type: string
    PluginHost:
      type: object
      required: [host, origin, credential_ports]
      properties:
        host:
          description: Lower-case hostname or IP literal.
          type: string
          examples: [crates-mirror.example.com]
        origin:
          description: '`manifest`: declared by the plugin. `operator`: added in the instance configuration.'
          type: string
          enum: [manifest, operator]
        credential_ports:
          description: The ports on which the host injects a credential configured for this host. Never the credential itself.
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
    PluginPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    TemplatePreviewRequest:
      description: |
        A template and the event to render it with: at most one of `event`, `event_id` and
        `sample`; with none of them, the built-in `full` sample.
      type: object
      required: [template]
      additionalProperties: false
      properties:
        template:
          description: A Go `text/template`, as a subscription's `template`.
          type: string
          minLength: 1
          maxLength: 32768
        event:
          description: A CloudEvents envelope as `EventRecord.event` holds it. Rendered as given; it is not checked against the envelope schema, only required to be an object.
          type: object
        event_id:
          $ref: '#/components/schemas/Ulid'
          description: The id of an event of the log (`404` when there is none).
        sample:
          description: A built-in sample event, `full` (every nullable field set) or `sparse` (every nullable field null, no watch name, no labels), the two events a template is checked against when a subscription is written.
          type: string
          enum: [full, sparse]
      not:
        description: more than one of event, event_id and sample
        anyOf:
          - required: [event, event_id]
          - required: [event, sample]
          - required: [event_id, sample]
    TemplatePreview:
      description: The result of rendering a template. Exactly one of `output` and `error` is `null`.
      type: object
      required: [output, content_type, error]
      properties:
        output:
          description: The rendered body, as a delivery would send it, or `null` when the template failed. Bytes that are not UTF-8 are replaced by U+FFFD.
          type: [string, 'null']
          maxLength: 262144
        content_type:
          description: The `Content-Type` a webhook delivery would send with the output (`application/json` when the output is a JSON object or array, else `text/plain`), or `null` when the template failed.
          type: [string, 'null']
          examples: [application/json; charset=utf-8]
        error:
          description: Why the template failed, or `null`.
          oneOf:
            - $ref: '#/components/schemas/TemplateError'
            - type: 'null'
    TemplateError:
      type: object
      required: [kind, line, column, reason]
      properties:
        kind:
          description: '`parse`: the template does not parse. `not_allowed`: it uses something templates may not (`define`, `template`, `block`). `exec`: it failed on this event (a missing key, a function error). `timeout`: it ran past its time limit. `output_too_large`: its output passed the size limit. `invalid_event`: the event is not a JSON object. Open set.'
          type: string
          pattern: '^[a-z][a-z_]{0,31}$'
          examples: [exec]
        line:
          description: The line of the template where it failed, from 1, or `null` when unknown.
          type: [integer, 'null']
          minimum: 1
        column:
          description: The column (in bytes, from 1), or `null` when unknown.
          type: [integer, 'null']
          minimum: 1
        reason:
          description: What went wrong, from a fixed set of messages. It never quotes the template text, which may hold something that should not be echoed.
          type: string
          maxLength: 1024
    NextCursor:
      description: The cursor of the next page, or `null` on the last page.
      oneOf:
        - $ref: '#/components/schemas/Cursor'
        - type: 'null'

    Problem:
      description: |
        RFC 9457 problem details. `type` is one of the URIs listed in docs/api.md (`about:blank`
        is not used); clients switch on `type`, never on `title` or `detail`. Unknown members
        must be ignored.
      type: object
      required: [type, title, status]
      properties:
        type:
          description: Identifies the problem type; `https://github.com/angelia-dev/spec/blob/main/docs/api.md#problem-<slug>`.
          type: string
          format: uri
          examples: ['https://github.com/angelia-dev/spec/blob/main/docs/api.md#problem-validation-failed']
        title:
          description: Short, human-readable summary of the problem type; the same for every occurrence.
          type: string
        status:
          description: The HTTP status code.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: Human-readable explanation of this occurrence. Never contains secrets.
          type: string
        instance:
          description: The request path.
          type: string
          format: uri-reference
        errors:
          description: For `validation-failed`, every error found (the request is validated as a whole).
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
        required_scope:
          description: For `forbidden`, the scope the operation needs.
          type: string
          enum: [read, write, admin]
        oldest_seq:
          $ref: '#/components/schemas/Seq'
          description: For `cursor-expired`, the `seq` of the oldest event kept; resume with `after` set just below it, accepting the gap.
    ProblemError:
      type: object
      required: [pointer, detail]
      properties:
        pointer:
          description: JSON Pointer (RFC 6901) to the offending member of the request body; `""` for the whole body.
          type: string
          examples: [/policy/prerelease]
        detail:
          description: What is wrong with it.
          type: string
    WebhookSinkConfig:
      description: The `config` of a `webhook` sink (the watch file's `sinks[].config` for that kind). Documentation of the built-in kind; the server validates against the kind's `config_schema`.
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          description: Absolute `https://` URL with no userinfo and no query parameter that looks like a secret.
          type: string
          format: uri
          x-angelia-destination: true
        secret_env:
          description: Name of an environment variable of the instance that holds the Standard Webhooks signing secret. At most one of `secret_env` and `secret_ref`; without either, deliveries are unsigned.
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        secret_ref:
          description: Name of a stored secret (`/v1/secrets`) that holds the Standard Webhooks signing secret. At most one of `secret_env` and `secret_ref`.
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
        timeout:
          $ref: '#/components/schemas/Duration'
          description: Per-attempt timeout, `1s` to `2m`.
          default: 10s
    GithubDispatchSinkConfig:
      description: |
        The `config` of a `github-dispatch` sink: it triggers a `repository_dispatch` event or a
        `workflow_dispatch` run in one GitHub repository. Documentation of the built-in kind; the
        server validates against the kind's `config_schema`.

        Exactly one of `token_env` and `token_ref` names the GitHub token (a fine-grained token
        or GitHub App installation token; `repository_dispatch` needs `contents: write`,
        `workflow_dispatch` needs `actions: write`). The token is sent only to `api_base_url`.

        **`repository_dispatch`** sends `event_type` (rendered from the template) and a flat
        `client_payload` with at most 10 top-level keys, the GitHub limit: `event_id`, `source`,
        `package`, `version`, `previous_version` (null when unknown), `bump`, `purl`,
        `release_url`, `watch` (the watch name) and, only when something was cut, `truncated: true`.
        Every string value is cut to at most 2048 bytes at a UTF-8 boundary; when any value is
        cut, `truncated` is `true`. If the JSON body would still exceed 60000 bytes (escaped
        control characters can multiply the size), the cut length is halved (1024, 512, ...)
        until the body fits, and `truncated` is `true`; this keeps the body under GitHub's
        65535-character limit for `client_payload`.

        **`workflow_dispatch`** sends `ref` and `inputs`: each value of `inputs` is a template
        rendered to a string and cut to 1024 bytes at a UTF-8 boundary (no marker: inputs are
        plain strings). GitHub accepts at most 25 inputs.

        Both templates are ADR 0016 templates (core repository), rendered with the same
        context as a subscription template. A template that fails to render is a permanent
        delivery error.

        Responses: `204` is success for both modes; `404`
        (repository, workflow or token without access) and `422` (invalid payload or inputs) are
        permanent errors; `5xx` is retried. A `403` or `429` caused by a rate limit is retried
        after `Retry-After` or `x-ratelimit-reset`; any other `4xx` is permanent. Redirects are not
        followed.
      type: object
      required: [repo]
      additionalProperties: false
      properties:
        mode:
          description: Which GitHub API is called.
          type: string
          enum: [repository_dispatch, workflow_dispatch]
          default: repository_dispatch
        repo:
          description: The target repository as `owner/name`.
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'
        api_base_url:
          description: Base URL of the GitHub REST API. For GitHub Enterprise Server it is `https://<host>/api/v3`. Absolute `https://` URL with no userinfo and no query. The token is sent only here.
          type: string
          format: uri
          default: https://api.github.com
          x-angelia-destination: true
        token_env:
          description: Name of an environment variable of the instance that holds the GitHub token. Exactly one of `token_env` and `token_ref`.
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        token_ref:
          description: Name of a stored secret (`/v1/secrets`) that holds the GitHub token. Exactly one of `token_env` and `token_ref`.
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
        event_type:
          description: Template of the `event_type` (`repository_dispatch` only). The result is 1 to 100 characters.
          type: string
          minLength: 1
          maxLength: 1024
          default: angelia.release.published
        workflow:
          description: Workflow file name (`release.yml`) or numeric id (`workflow_dispatch` only, required there).
          type: string
          minLength: 1
          maxLength: 255
        ref:
          description: Branch or tag the workflow runs on (`workflow_dispatch` only, required there).
          type: string
          minLength: 1
          maxLength: 255
        inputs:
          description: >-
            Workflow inputs (`workflow_dispatch` only). Keys are input names, values are templates.
            An input name must not end in `_env` or `_ref`: the core reads every such key of a
            sink configuration as the name of an environment variable or of a stored secret.
          type: object
          maxProperties: 25
          propertyNames:
            not:
              pattern: '(_env|_ref)$'
          additionalProperties:
            type: string
            maxLength: 4096
        timeout:
          $ref: '#/components/schemas/Duration'
          description: Per-attempt timeout, `1s` to `2m`.
          default: 10s
      allOf:
        - oneOf:
            - required: [token_env]
              not:
                required: [token_ref]
            - required: [token_ref]
              not:
                required: [token_env]
        - if:
            properties:
              mode:
                const: workflow_dispatch
            required: [mode]
          then:
            required: [workflow, ref]
            not:
              required: [event_type]
          else:
            not:
              anyOf:
                - required: [workflow]
                - required: [ref]
                - required: [inputs]
    ShoutrrrSinkConfig:
      description: |
        The `config` of a `shoutrrr` sink: it sends a plain-text message to one chat or push
        service through the shoutrrr library (ADR 0026, core repository). Documentation of the
        built-in kind; the server validates against the kind's `config_schema`.

        The **whole shoutrrr service URL is a secret** (`slack://hook:…@webhook`,
        `ntfy://host/topic`, …), named by exactly one of `url_ref` and `url_env`. Both keys are
        marked `x-angelia-secret-destination`: the URL is never stored in the configuration,
        returned, logged or put in `last_error`. At every delivery the server derives the HTTP
        origins the service sends to and checks each of them before sending: `https` (or
        `http` only for a host in the instance's `http.allow_http_hosts`), the SSRF guard, and
        the stored secret's `hosts` when it has any. Every request is pinned to those origins;
        redirects are not followed.

        Allowed services (URL schemes) and their origins: `slack` (`hooks.slack.com` for a
        webhook token, `slack.com` for an `xoxb`/`xoxp` token), `discord` (`discord.com`),
        `telegram` (`api.telegram.org`, or the `apiurl` host), `ntfy` (the URL host, default
        `ntfy.sh`), `gotify` (the URL host) and `matrix` (the URL host, access-token form
        `matrix://:TOKEN@host` only). Every other scheme (`generic`, `smtp`, …) and
        `skiptlsverify=yes` are refused. Title, priority and similar options come from the
        URL's query.

        A failure derived from the URL (an unparsable or refused URL, a `service` mismatch, a
        host refused by the SSRF guard or by the secret's `hosts`) happens before sending and is
        retried, since the fix is to rewrite the secret. HTTP responses are classified as for
        the `webhook` kind: `3xx` and `4xx` other than `408` and `429` are permanent; `408`,
        `429` and `5xx` are retried. `last_error` names the service and the origin only.
      type: object
      additionalProperties: false
      properties:
        url_ref:
          description: Name of a stored secret (`/v1/secrets`) whose value is one shoutrrr service URL. Its `hosts`, when set, must contain every HTTP host the service sends to; without `hosts`, `config check` warns. Exactly one of `url_ref` and `url_env`.
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          x-angelia-secret-destination: true
        url_env:
          description: Name of an environment variable of the instance whose value is one shoutrrr service URL. Exactly one of `url_ref` and `url_env`.
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          x-angelia-secret-destination: true
        service:
          description: Optional. The service the URL must be for; at delivery, the URL's scheme must equal it, or the attempt fails (retried). It shows the service without revealing the secret.
          type: string
          enum: [slack, discord, telegram, ntfy, gotify, matrix]
        timeout:
          $ref: '#/components/schemas/Duration'
          description: Per-attempt timeout, `1s` to `2m`.
          default: 10s
      oneOf:
        - required: [url_ref]
          not:
            required: [url_env]
        - required: [url_env]
          not:
            required: [url_ref]

