# Instance configuration for the full example (Angelia on Postgres). compose.yaml overrides
# database.dsn with ANGELIA_DATABASE_DSN, which adds the password from .env; the DSN below has none.
instance:
  name: homelab-full

listen: ":8080"

database:
  dsn: postgres://angelia@postgres:5432/angelia?sslmode=disable

roles: [all]

log:
  format: json
  level: info
