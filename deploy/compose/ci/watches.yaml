# Watch file for the CI quickstart check: one watch of the fake registry's only
# package, one webhook sink, one subscription. Applied by `serve --watches` at start.
version: 1

sinks:
  - name: ci-receiver
    kind: webhook
    config:
      url: http://receiver:9000/hook
      # The value is generated by run.sh for each run and passed to both containers.
      secret_env: CI_WEBHOOK_SECRET
      timeout: 5s

watches:
  - name: fake-package
    source: pypi
    coordinates:
      name: pkg-00000
    # The shortest interval the watch file allows (docs/watch-file.md). The first check
    # records the versions known at start (baseline); an event needs the second check.
    interval: 5m

subscriptions:
  - name: ci-releases
    sink: ci-receiver
