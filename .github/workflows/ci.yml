name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Jobs that need more get it in their own `permissions`.
permissions:
  contents: read

# Cancel superseded runs of a pull request. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (CGO disabled)
        run: make build
      - name: Smoke-test the binary
        run: ./bin/angelia version

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint v2.15.0 is built with Go 1.27; older releases cannot lint this module.
      - name: golangci-lint run
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          args: run
      - name: gofumpt format check
        run: |
          # The action installs the binary under $HOME and does not add it to PATH.
          bin="$(find "$HOME" -maxdepth 2 -type f -name golangci-lint | head -n 1)"
          if [[ -z "$bin" ]]; then
            echo "::error::golangci-lint binary not found under $HOME"
            exit 1
          fi
          "$bin" fmt --diff

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests with race detector and coverage
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage gate (internal/, 80%)
        run: scripts/coverage-gate.sh coverage.out 80

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities
        run: make vuln

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.0
        with:
          languages: go
      - uses: github/codeql-action/analyze@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4.31.0
        with:
          category: "/language:go"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  # Single required check. Fails unless every job above succeeded; the only
  # allowed skip is dependency-review on push events, where it does not run.
  ci-ok:
    name: CI OK
    if: always()
    needs: [build, lint, test, govulncheck, codeql, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BUILD: ${{ needs.build.result }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      GOVULNCHECK: ${{ needs.govulncheck.result }}
      CODEQL: ${{ needs.codeql.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
    steps:
      - name: Check job results
        run: |
          failed=0
          check() {
            local job="$1" result="$2" allow_skip="$3"
            case "$result" in
            success) echo "$job: success" ;;
            skipped)
              if [[ "$allow_skip" == yes ]]; then
                echo "$job: skipped (expected for $EVENT_NAME)"
              else
                echo "::error::$job was skipped unexpectedly"
                failed=1
              fi
              ;;
            *)
              echo "::error::$job finished with result '$result'"
              failed=1
              ;;
            esac
          }
          check build "$BUILD" no
          check lint "$LINT" no
          check test "$TEST" no
          check govulncheck "$GOVULNCHECK" no
          check codeql "$CODEQL" no
          if [[ "$EVENT_NAME" == pull_request ]]; then
            check dependency-review "$DEPENDENCY_REVIEW" no
          else
            check dependency-review "$DEPENDENCY_REVIEW" yes
          fi
          exit "$failed"
