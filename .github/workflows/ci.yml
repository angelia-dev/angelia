name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Jobs that need more get it in their own `permissions`.
permissions:
  contents: read

# Cancel superseded runs of a pull request. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (CGO disabled)
        run: make build
      - name: Smoke-test the binary
        run: ./bin/angelia version

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned golangci-lint version lives in the Makefile (GOLANGCI_LINT_VERSION).
      - name: Install golangci-lint
        run: make lint-tools
      - name: Lint and format check
        run: make lint GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres for the store tests (story #85, ADR 0028 §6, decision D18): the
    # image digest pinned in deploy/compose/full/compose.yaml. Each test makes
    # its own schema (internal/store/pgtest). Trust auth on a job-local
    # container, so no password is set anywhere.
    services:
      postgres:
        image: postgres:17-alpine@sha256:562a6e0a66b5136bc28bef5944bbc2ddddf8ea0058d4016b96cee63f2edaf143
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Postgres tests fail instead of skipping when the service is missing.
      - name: Tests with race detector and coverage
        env:
          ANGELIA_TEST_POSTGRES_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
          ANGELIA_TEST_POSTGRES_REQUIRED: "1"
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage gate (internal/, 80%)
        run: scripts/coverage-gate.sh coverage.out 80

  # Phase 0 benchmark 6: version ordering against the committed registry
  # snapshots (bench/ordering/README.md). Offline: reads testdata only.
  bench-ordering:
    name: bench-ordering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Version ordering vs PyPI and npm
        run: make bench-ordering

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities
        run: make vuln

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          build-mode: manual
      - name: Build for CodeQL
        run: make build
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:go"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2

  # Path filter for bench/plugins/** and for the quickstart check. A job-level filter (not `on.paths`) so the
  # workflow always runs and CI OK always reports. No third-party action: it
  # diffs the commit range itself. When the range cannot be determined (new
  # branch, force push) it errs on the side of running the check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes under bench/plugins/, to the quickstart inputs or to this workflow
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # A pull request uses the merge base (three dots), so changes that
          # landed on the base branch after it branched do not count.
          if [[ "$EVENT_NAME" == pull_request ]]; then
            range="$PR_BASE...$PR_HEAD"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          if ! files="$(git diff --name-only "$range" --)"; then
            echo "cannot diff $range; running the plugin and quickstart checks"
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            echo "quickstart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A change to this workflow also runs the check, so edits to the
          # job itself are exercised by their own CI run.
          if grep -qE '^(bench/plugins/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi
          # The quickstart check runs the real image against the compose example, so it
          # follows the code that goes into the image, the example and its harness.
          if grep -qE '^(cmd/|internal/|api/|bench/fakereg/|deploy/compose/|Dockerfile$|go\.(mod|sum)$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "quickstart=true" >> "$GITHUB_OUTPUT"
          else
            echo "quickstart=false" >> "$GITHUB_OUTPUT"
          fi

  # The committed .wasm plugins of benchmark 4 must match a fresh build byte for
  # byte (bench/plugins/build.sh). Toolchain: bench/plugins/rust-toolchain.toml.
  wasm-repro:
    name: wasm-repro
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and wasm32 target
        working-directory: bench/plugins
        run: rustup toolchain install
      - name: Rebuild and compare the committed .wasm files
        run: bench/plugins/build.sh --check

  # Story #77: the SQLite compose example, verified end to end. Builds the image,
  # starts the stack with a fake registry and a webhook receiver (deploy/compose/ci/),
  # has the registry publish a version and waits for the signed release event at the
  # receiver. The watch interval is at least 5 minutes, so the wait is about that long.
  quickstart:
    name: quickstart
    needs: changes
    if: needs.changes.outputs.quickstart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # run.sh builds the image and the test doubles, starts the stack, asserts, prints the
      # logs on failure and always runs `docker compose down -v`.
      - name: Compose up, publish a version, expect the webhook
        run: deploy/compose/ci/run.sh
      # run.sh cleans up by itself; this covers a step killed before its trap ran.
      - name: Compose down
        if: always()
        env:
          CI_WEBHOOK_SECRET: unused-by-down
        run: |
          docker compose -p angelia-quickstart-ci \
            -f deploy/compose/sqlite/compose.yaml \
            -f deploy/compose/ci/compose.override.yaml \
            down -v --remove-orphans

  # Single required check. Fails unless every job above succeeded; the only
  # allowed skips are dependency-review on push events, where it does not run,
  # wasm-repro when the changes job found nothing under bench/plugins/, and quickstart
  # when it found nothing that goes into the image or the compose example.
  ci-ok:
    name: CI OK
    if: always()
    needs: [build, lint, test, bench-ordering, govulncheck, codeql, dependency-review, changes, wasm-repro, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVENT_NAME: ${{ github.event_name }}
      BUILD: ${{ needs.build.result }}
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      BENCH_ORDERING: ${{ needs.bench-ordering.result }}
      GOVULNCHECK: ${{ needs.govulncheck.result }}
      CODEQL: ${{ needs.codeql.result }}
      DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
      CHANGES: ${{ needs.changes.result }}
      PLUGINS_CHANGED: ${{ needs.changes.outputs.plugins }}
      WASM_REPRO: ${{ needs.wasm-repro.result }}
      QUICKSTART_CHANGED: ${{ needs.changes.outputs.quickstart }}
      QUICKSTART: ${{ needs.quickstart.result }}
    steps:
      - name: Check job results
        run: |
          failed=0
          check() {
            local job="$1" result="$2" allow_skip="$3"
            case "$result" in
            success) echo "$job: success" ;;
            skipped)
              if [[ "$allow_skip" == yes ]]; then
                echo "$job: skipped (expected for $EVENT_NAME)"
              else
                echo "::error::$job was skipped unexpectedly"
                failed=1
              fi
              ;;
            *)
              echo "::error::$job finished with result '$result'"
              failed=1
              ;;
            esac
          }
          check build "$BUILD" no
          check lint "$LINT" no
          check test "$TEST" no
          check bench-ordering "$BENCH_ORDERING" no
          check govulncheck "$GOVULNCHECK" no
          check codeql "$CODEQL" no
          if [[ "$EVENT_NAME" == pull_request ]]; then
            check dependency-review "$DEPENDENCY_REVIEW" no
          else
            check dependency-review "$DEPENDENCY_REVIEW" yes
          fi
          check changes "$CHANGES" no
          # wasm-repro may be skipped only when the path filter did not match.
          if [[ "$PLUGINS_CHANGED" == true ]]; then
            check wasm-repro "$WASM_REPRO" no
          else
            check wasm-repro "$WASM_REPRO" yes
          fi
          # quickstart likewise: skipped only when the path filter did not match.
          if [[ "$QUICKSTART_CHANGED" == true ]]; then
            check quickstart "$QUICKSTART" no
          else
            check quickstart "$QUICKSTART" yes
          fi
          exit "$failed"
