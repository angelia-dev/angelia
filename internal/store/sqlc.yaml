version: "2"
sql:
  - engine: sqlite
    schema: migrations/sqlite
    queries: sqlite/queries.sql
    gen:
      go:
        package: sqlite
        out: sqlite
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
  - engine: postgresql
    schema: migrations/postgres
    queries: postgres/queries.sql
    gen:
      go:
        package: postgres
        out: postgres
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
